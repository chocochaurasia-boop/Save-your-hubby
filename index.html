
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ankita's Never Ending Battle ❤️</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17142c;color:white;
 font-family:Arial,sans-serif;text-align:center;
 touch-action:manipulation;
}
header{padding:12px;background:#282044}
header h2{color:#ffb5d1;margin:5px}
#game{
 position:relative;width:100%;max-width:600px;
 height:68vh;min-height:450px;max-height:680px;
 margin:auto;overflow:hidden;
 border:3px solid #ffb5d1;border-radius:16px;
 background:linear-gradient(#272c62,#9b589b);
}
#stars{
 position:absolute;inset:0;opacity:.5;
 background-image:radial-gradient(white 1px,transparent 1px);
 background-size:35px 35px;
}
#hud{
 position:absolute;top:8px;width:100%;
 display:flex;justify-content:space-around;
 z-index:5;font-size:13px;font-weight:bold;
}
#girl{
 position:absolute;bottom:15px;left:50%;
 transform:translateX(-50%);
 font-size:65px;z-index:4;
}
.enemy{
 position:absolute;font-size:43px;
 z-index:3;transform:translate(-50%,-50%);
}
.speech-bubble{
 position:absolute;z-index:9;
 transform:translate(-50%,-100%);
 padding:8px 10px;border-radius:13px;
 font-size:12px;font-weight:bold;
 line-height:1.3;width:max-content;
 max-width:155px;text-align:center;
 box-shadow:0 3px 8px #17142c;
 pointer-events:none;
}
.ankita-bubble{background:#ffd1e5;color:#351b3d}
.enemy-bubble{background:white;color:#292044}
.bullet{
 position:absolute;z-index:7;
 background:white;color:#e63879;
 border:2px solid #ff9fc6;
 border-radius:20px;padding:6px 10px;
 font-weight:bold;font-size:14px;
 white-space:nowrap;pointer-events:none;
}
#overlay{
 position:absolute;inset:0;z-index:20;
 background:#17142cee;
 display:flex;align-items:center;
 justify-content:center;padding:20px;
}
.panel{max-width:370px}
.panel h1{color:#ff9fc6}
.panel p{line-height:1.6}
.hidden{display:none!important}
#controls{max-width:600px;margin:9px auto}
button{
 border:0;border-radius:14px;padding:12px 15px;
 margin:3px;font-weight:bold;font-size:15px;
 background:#ffb5d1;color:#351b3d;
 cursor:pointer;
}
button:active{transform:scale(.93)}
#fire{background:#ff477e;color:white;min-width:115px}
#status{font-size:13px;color:#ffd8e9;min-height:20px}
</style>
</head>

<body>

<header>
<h2>💗 ANKITA: THE LAST DEFENDER 💗</h2>
<div>MISSION: SAVE PROTHOMIT 😂</div>
</header>

<div id="game">

<div id="stars"></div>

<div id="hud">
 <div>❤️ LIVES<br><span id="lives">5</span></div>
 <div>⭐ SCORE<br><span id="score">0</span></div>
 <div>👾 KILLS<br><span id="kills">0</span></div>
 <div>⏱️ TIME<br><span id="timer">60</span>s</div>
</div>

<div id="girl">👧🏻</div>

<div id="overlay">
 <div class="panel">
  <h1>💗 ANKITA'S MISSION 💗</h1>
  <p>Enemy team has kidnapped Prothomit!</p>
  <p>Only Ankita can save her husband!</p>
  <p>Her legendary weapons:</p>
  <p>💬 Hmm | Accha | 👍</p>
  <p>Survive for 60 seconds!</p>
  <button onclick="startGame()">START MISSION 🚀</button>
 </div>
</div>

</div>

<div id="controls">
 <div id="status">Waiting for Ankita... 🥱</div>
 <button onclick="move(-1)">⬅️ LEFT</button>
 <button id="fire" onclick="shoot()">FIRE! 💬</button>
 <button onclick="move(1)">RIGHT ➡️</button>
 <br>
 <button onclick="shoot('hmm')">Hmm 💗</button>
 <button onclick="shoot('accha')">Accha 😌</button>
 <button onclick="shoot('👍')">👍</button>
</div>

<script>
const game=document.getElementById("game");
const girl=document.getElementById("girl");
const overlay=document.getElementById("overlay");

let active=false;
let playerX=50;
let lives=5;
let score=0;
let kills=0;
let enemies=[];
let bullets=[];
let timeLeft=60;
let animation=null;
let timerInterval=null;
let dialogueInterval=null;
let lastTime=0;
let lastSpawn=0;
let lastConversation=0;
let talkIndex=0;

const conversations=[
 ["ankita","aaaaa mujheee gusssaaaa arha haiiii 😡"],
 ["enemy","Nooo I want kissyyyy 😘"],
 ["ankita","aaaaeeee papa phone leliyeeee 📱"],
 ["enemy","areee pehle maar toh lo mujheee 😂"],
 ["ankita","mujhe neeenddd aarhiii haiiii I'm sooo sleepyyy 🥱"],
 ["enemy","areee pehle apne pati ko toh baccha leee ❤️"],
 ["ankita","hmmmmmmmm!! 😶"],
 ["enemy","areee meri maa thik se jawab toh deeee 😂"],
 ["ankita","ACCHAAAAA!!! 😤"],
 ["enemy","Areyyy itna gussa kyuuu?! 😭"],
 ["ankita","👍"],
 ["enemy","Bas thumbs up se kya hoga meri maa 😂"],
 ["ankita","PROTHOMIT KO CHHORO!!! 😡"],
 ["enemy","Pehle ek kiss toh de doooo 😘"],
 ["ankita","MERE PAAS TIME NAHI HAI 😴"],
 ["enemy","Areyyy phir se neend aa gayi?! 🥱"]
];

function updateHUD(){
 document.getElementById("lives").textContent=lives;
 document.getElementById("score").textContent=score;
 document.getElementById("kills").textContent=kills;
 document.getElementById("timer").textContent=timeLeft;
}

function makeBubble(who,text,x,y){
 const bubble=document.createElement("div");
 bubble.className="speech-bubble "+
 (who==="ankita"?"ankita-bubble":"enemy-bubble");
 bubble.textContent=text;
 bubble.style.left=x+"%";
 bubble.style.top=y+"px";
 game.appendChild(bubble);
 return bubble;
}

function removeBubble(entity){
 if(entity.bubble){
  entity.bubble.remove();
  entity.bubble=null;
 }
}

function move(dir){
 if(!active)return;
 playerX=Math.max(9,Math.min(91,playerX+dir*9));
 girl.style.left=playerX+"%";
}

function shoot(type){
 if(!active)return;

 const options=["hmm","accha","👍"];
 const weapon=type||options[Math.floor(Math.random()*3)];

 const bullet=document.createElement("div");
 bullet.className="bullet";
 bullet.textContent=weapon;
 bullet.style.left=playerX+"%";
 bullet.style.top=(game.clientHeight-105)+"px";
 game.appendChild(bullet);

 bullets.push({
  el:bullet,x:playerX,
  y:game.clientHeight-105
 });
}

function spawnEnemy(){
 if(!active||enemies.length>=5)return;

 const el=document.createElement("div");
 el.className="enemy";
 el.textContent=["👾","👹","🤡","👻","😈"][
  Math.floor(Math.random()*5)
 ];

 const x=8+Math.random()*84;
 el.style.left=x+"%";
 el.style.top="-35px";
 game.appendChild(el);

 const enemy={
  el:el,x:x,y:-35,
  speed:65+Math.min(score*.12,100),
  bubble:null
 };

 enemies.push(enemy);
}

function conversation(){
 if(!active)return;

 const [who,message]=conversations[talkIndex];

 if(who==="ankita"){
  makeBubble(
   "ankita",
   message,
   playerX,
   game.clientHeight-100
  );
 }else if(enemies.length>0){
  const e=enemies[0];
  makeBubble(
   "enemy",
   message,
   e.x,
   Math.max(145,e.y-20)
  );
 }else{
  makeBubble(
   "enemy",
   message,
   50,
   145
  );
 }

 talkIndex=(talkIndex+1)%conversations.length;
}

function startCountdown(){
 clearInterval(timerInterval);
 timeLeft=60;
 updateHUD();

 timerInterval=setInterval(()=>{
  if(!active)return;

  timeLeft--;
  updateHUD();

  if(timeLeft<=0){
   gameOverTime();
  }
 },1000);
}

function startGame(){
 stopGame();

 active=true;
 playerX=50;
 lives=5;
 score=0;
 kills=0;
 timeLeft=60;
 enemies=[];
 bullets=[];
 talkIndex=0;
 lastTime=0;
 lastSpawn=performance.now();

 game.querySelectorAll(".enemy,.bullet,.speech-bubble")
 .forEach(el=>el.remove());

 girl.style.left="50%";
 overlay.classList.add("hidden");

 updateHUD();

 document.getElementById("status").textContent=
 "Ankita has entered the battlefield! ❤️";

 startCountdown();
 conversation();

 dialogueInterval=setInterval(()=>{
  if(active)conversation();
 },2300);

 animation=requestAnimationFrame(gameLoop);
}

function stopGame(){
 active=false;

 clearInterval(timerInterval);
 clearInterval(dialogueInterval);

 if(animation!==null){
  cancelAnimationFrame(animation);
  animation=null;
 }
}

function gameLoop(timestamp){
 if(!active)return;

 const dt=lastTime?
 Math.min((timestamp-lastTime)/1000,.05):0;

 lastTime=timestamp;

 // Continuously respawn enemies
 if(timestamp-lastSpawn>1300){
  spawnEnemy();
  lastSpawn=timestamp;
 }

 // Move enemies
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  e.y+=e.speed*dt;
  e.el.style.top=e.y+"px";

  if(e.bubble){
   e.bubble.style.left=e.x+"%";
   e.bubble.style.top=Math.max(145,e.y-20)+"px";
  }

  if(e.y>game.clientHeight-75){
   e.el.remove();
   removeBubble(e);
   enemies.splice(i,1);

   lives--;
   updateHUD();

   document.getElementById("status").textContent=
   "Oh no! An enemy escaped! 😭";

   if(lives<=0){
    gameOverLives();
    return;
   }
  }
 }

 // Move Ankita's speech ammunition
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.y-=430*dt;
  b.el.style.top=b.y+"px";

  if(b.y<-40){
   b.el.remove();
   bullets.splice(i,1);
   continue;
  }

  // Check whether ammunition hits an enemy
  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j];

   if(Math.abs(b.x-e.x)<9&&Math.abs(b.y-e.y)<40){
    e.el.remove();
    removeBubble(e);
    enemies.splice(j,1);

    b.el.remove();
    bullets.splice(i,1);

    score+=10;
    kills++;

    document.getElementById("status").textContent=
    "Enemy defeated! Ankita is unstoppable! 😂";

    updateHUD();
    break;
   }
  }
 }

 // Keep Ankita's bubble attached to her head
 const girlBubble=document.getElementById("ankita-current");

 if(girlBubble){
  girlBubble.style.left=playerX+"%";
  girlBubble.style.top=(game.clientHeight-95)+"px";
 }

 animation=requestAnimationFrame(gameLoop);
}

// Dialogue bubbles for Ankita stay above her head
const originalMakeBubble=makeBubble;
makeBubble=function(who,text,x,y){
 if(who==="ankita"){
  const old=document.getElementById("ankita-current");
  if(old)old.remove();

  const bubble=originalMakeBubble(who,text,x,y);
  bubble.id="ankita-current";
  return bubble;
 }

 if(who==="enemy"){
  const old=document.getElementById("enemy-current");
  if(old)old.remove();

  const bubble=originalMakeBubble(who,text,x,y);
  bubble.id="enemy-current";
  return bubble;
 }
};

function gameOverTime(){
 if(!active)return;

 stopGame();

 overlay.innerHTML=`
 <div class="panel">
  <h1>🥱 TIME'S UP!</h1>
  <h2>AYEEEE ANKITAAAA SOOO GYIIII FIRRR UFFFFFF 😭😂</h2>
  <p>Prothomit is still waiting to be rescued!</p>
  <p>👾 Enemies defeated: ${kills}</p>
  <h2>⭐ Score: ${score}</h2>
  <button onclick="startGame()">PLAY AGAIN ❤️</button>
 </div>`;

 overlay.classList.remove("hidden");
}

function gameOverLives(){
 if(!active)return;

 stopGame();

 overlay.innerHTML=`
 <div class="panel">
  <h1>😭 ANKITA NEEDS HELP!</h1>
  <h2>GAME OVER 😂</h2>
  <p>Enemy: "Areyyy uthooo meri maa!"</p>
  <p>Prothomit: "You tried your best, Ankita! ❤️"</p>
  <h2>⭐ Score: ${score}</h2>
  <p>Enemies defeated: ${kills}</p>
  <button onclick="startGame()">TRY AGAIN 🔁</button>
 </div>`;

 overlay.classList.remove("hidden");
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);

 if(e.code==="Space"){
  e.preventDefault();
  shoot();
 }
});
</script>

</body>
</html>
